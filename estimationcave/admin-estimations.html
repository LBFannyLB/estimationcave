<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard leads — estimationcave</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bordeaux:#2D1B2E; --or:#C5A258; --fond:#FAF6F0; --blanc:#fff;
    --texte:#3a2f38; --gris:#8a7d86; --border:#e3d9c4; --border2:#ece3d2;
    --vert:#2e7d52; --rouge:#b42828; --or-pale:#f6efe0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#f2ece2;color:var(--texte);
    font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;}
  a{color:var(--bordeaux);}
  .wrap{max-width:1240px;margin:0 auto;padding:0 20px;}

  /* ── LOGIN ── */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  #login[hidden]{display:none;}
  .login-card{background:var(--blanc);border:1px solid var(--border);border-top:3px solid var(--or);
    border-radius:10px;padding:32px 30px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(45,27,46,.10);}
  .login-card .marque{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--or);font-weight:600;}
  .login-card h1{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--bordeaux);margin:6px 0 4px;}
  .login-card p{color:var(--gris);font-size:13px;margin:0 0 20px;}
  .login-card label{display:block;font-size:12px;font-weight:600;color:var(--bordeaux);margin-bottom:6px;}
  .login-card input{width:100%;border:1px solid #d8cfc0;border-radius:8px;padding:11px 12px;font-size:14px;
    font-family:inherit;background:#fffdfa;color:var(--texte);}
  .login-card input:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px rgba(197,162,88,.18);}
  .login-card button{margin-top:16px;width:100%;background:var(--bordeaux);color:var(--fond);border:none;
    border-radius:8px;padding:12px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;}
  .login-card button:hover{background:#3d2740;}
  .login-err{color:var(--rouge);font-size:12.5px;margin-top:12px;min-height:16px;font-weight:500;}

  /* ── APP ── */
  #app[hidden]{display:none;}
  .topbar{background:var(--blanc);border-bottom:3px solid var(--or);}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:16px;padding-bottom:16px;gap:12px;flex-wrap:wrap;}
  .topbar .brand .marque{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--or);font-weight:600;}
  .topbar .brand h1{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:600;color:var(--bordeaux);margin:2px 0 0;}
  .topbar .actions{display:flex;gap:8px;align-items:center;}
  .btn{border:1px solid #d8cfc0;background:var(--blanc);color:var(--bordeaux);border-radius:7px;
    padding:8px 13px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;}
  .btn:hover{border-color:var(--or);}
  .btn-primary{background:var(--bordeaux);color:var(--fond);border-color:var(--bordeaux);}
  .btn-primary:hover{background:#3d2740;}

  .filters{display:flex;gap:7px;flex-wrap:wrap;padding:18px 0 4px;}
  .chip{border:1px solid var(--border);background:var(--blanc);color:var(--texte);border-radius:20px;
    padding:6px 13px;font-size:12.5px;font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center;}
  .chip:hover{border-color:var(--or);}
  .chip.active{background:var(--bordeaux);color:var(--fond);border-color:var(--bordeaux);}
  .chip .n{font-size:11px;opacity:.7;font-weight:600;}
  .chip.active .n{opacity:.85;}

  .meta{color:var(--gris);font-size:12px;padding:6px 0 14px;}

  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--blanc);margin-bottom:40px;}
  table{border-collapse:collapse;width:100%;min-width:960px;}
  thead th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--or);
    font-weight:600;padding:12px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:#fbf7ef;}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--border2);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.saved{animation:flash 1.1s ease;}
  @keyframes flash{0%{background:rgba(46,125,82,.16);}100%{background:transparent;}}
  .c-date{color:var(--gris);font-size:12px;white-space:nowrap;}
  .c-bottle strong{color:var(--bordeaux);font-weight:600;display:block;}
  .c-bottle span{color:var(--gris);font-size:12px;}
  .c-email a{color:var(--bordeaux);text-decoration:none;font-size:13px;word-break:break-all;}
  .c-email a:hover{text-decoration:underline;}
  .c-src{font-size:12px;color:var(--texte);white-space:nowrap;}
  .c-src .canal{font-weight:600;color:var(--bordeaux);display:block;}
  .c-src .entree{color:var(--gris);display:block;margin-top:2px;}
  .c-src .chemin{color:var(--gris);display:block;margin-top:2px;font-size:11px;cursor:help;border-bottom:1px dotted var(--border);width:max-content;}
  .funnel{display:flex;gap:10px;flex-wrap:wrap;padding:14px 0 4px;}
  .funnel .kpi{background:var(--blanc);border:1px solid var(--border);border-radius:8px;padding:9px 14px;min-width:120px;}
  .funnel .kpi .v{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--bordeaux);line-height:1;}
  .funnel .kpi .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);margin-top:4px;font-weight:600;}
  .funnel .kpi.paye .v{color:var(--vert);}
  .badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;}
  .badge.hot{background:#f7e4c4;color:#8a5a12;}
  .badge.warm{background:var(--or-pale);color:#7a6a3a;}
  .badge.type-audit{background:var(--bordeaux);color:var(--fond);}
  .badge.type-offerte{background:var(--or-pale);color:#7a6a3a;border:1px solid var(--border);}
  .badge.type-apercu{background:var(--or);color:var(--bordeaux);}
  .badge.type-tableur{background:#eef2ec;color:var(--vert);border:1px solid #cfdccb;}
  .rappel{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;color:#fff;background:var(--vert);padding:1px 8px;border-radius:20px;}
  .echeance{display:block;margin-top:3px;font-size:12px;color:var(--rouge);font-weight:500;}
  .suivi{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .suivi.due{background:#fde7e7;color:var(--rouge);}
  .suivi.soon{background:var(--or-pale);color:#7a6a3a;}
  .suivi.ok{background:#e6f2ea;color:var(--vert);}
  .suivi.none{color:var(--gris);font-weight:500;}
  .suivi-d{display:block;font-size:11px;color:var(--gris);margin-top:3px;}
  .chip.due{border-color:var(--rouge);color:var(--rouge);}
  .chip.due.active{background:var(--rouge);border-color:var(--rouge);color:#fff;}
  .cave-txt{font-size:12px;color:var(--gris);display:block;margin-top:2px;}
  .c-prospect strong{color:var(--bordeaux);font-weight:600;display:block;}
  .c-prospect .tel{color:var(--gris);font-size:12px;display:block;margin-top:2px;}
  .c-prospect a{color:var(--bordeaux);text-decoration:none;font-size:13px;word-break:break-all;}
  .c-prospect a:hover{text-decoration:underline;}
  .detail-note{color:var(--gris);font-size:12px;display:block;margin-top:3px;font-style:italic;}
  .attach{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;color:#7a6a3a;background:var(--or-pale);padding:1px 8px;border-radius:20px;}
  input.f-cote,input.f-notes{border:1px solid #e0d6c6;border-radius:6px;padding:7px 8px;font-size:12.5px;
    font-family:inherit;background:#fffdfa;color:var(--texte);width:100%;}
  input.f-cote{width:78px;text-align:center;}
  input.f-cote:focus,input.f-notes:focus,select.f-statut:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 2px rgba(197,162,88,.16);}
  select.f-statut{border:1px solid #e0d6c6;border-radius:6px;padding:7px 8px;font-size:12.5px;font-family:inherit;
    background:#fffdfa;color:var(--texte);cursor:pointer;}
  .c-notes{min-width:200px;}
  .btn-save{border:1px solid var(--bordeaux);background:var(--bordeaux);color:var(--fond);border-radius:6px;
    padding:7px 12px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;}
  .btn-save:hover{background:#3d2740;}
  .btn-save.ok{background:var(--vert);border-color:var(--vert);}
  .empty{text-align:center;color:var(--gris);padding:60px 20px;font-size:14px;}
  .loading{text-align:center;color:var(--gris);padding:40px;font-size:13px;}
  @media(max-width:600px){.topbar .brand h1{font-size:20px;}}
</style>
</head>
<body>

  <!-- ── LOGIN ── -->
  <div id="login">
    <form class="login-card" id="login-form" autocomplete="off">
      <div class="marque">estimationcave.com</div>
      <h1>Dashboard leads</h1>
      <p>Estimations &amp; demandes d'audit — accès réservé.</p>
      <label for="token">Mot de passe</label>
      <input type="password" id="token" name="token" autocomplete="current-password" autofocus>
      <button type="submit">Se connecter</button>
      <div class="login-err" id="login-err" role="alert"></div>
    </form>
  </div>

  <!-- ── APP ── -->
  <div id="app" hidden>
    <div class="topbar">
      <div class="wrap">
        <div class="brand">
          <div class="marque">estimationcave.com</div>
          <h1>Leads — estimations &amp; audits</h1>
        </div>
        <div class="actions">
          <button class="btn" id="refresh" type="button">↻ Actualiser</button>
          <button class="btn" id="logout" type="button">Déconnexion</button>
        </div>
      </div>
    </div>

    <div class="wrap">
      <div class="funnel" id="funnel"></div>
      <div class="filters" id="type-filters"></div>
      <div class="filters" id="filters"></div>
      <div class="meta" id="meta"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Reçu</th><th>Type</th><th>Prospect</th><th>Demande</th><th>Source</th>
              <th>Taille</th><th>Suivi</th><th>Cote</th><th>Statut</th><th>Notes</th><th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" hidden>Aucun lead pour ce filtre.</div>
    </div>
  </div>

<script>
(function(){
  var API = '/api/leads';
  var TKEY = 'ec_admin_token';
  var STATUTS = [
    {v:'a_traiter', l:'À traiter'},
    {v:'repondu',   l:'Répondu'},
    {v:'relance',   l:'Relancé'},
    {v:'converti',  l:'Converti'},
    {v:'paye',      l:'Payé'},
    {v:'perdu',     l:'Perdu'}
  ];
  var TYPES = [
    {v:'demande', l:'Audits 199€'},
    {v:'apercu',  l:'Aperçus 3 btl'},
    {v:'offerte', l:'Offertes'},
    {v:'tableur', l:'Tableur'}
  ];
  var all = [];
  var filter = '';
  var typeFilter = '';

  function token(){ return localStorage.getItem(TKEY) || ''; }
  function headers(){ return { 'Authorization':'Bearer '+token() }; }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function fmtDate(iso){
    if(!iso) return '';
    var d = new Date(iso);
    if(isNaN(d)) return esc(iso);
    return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' '+
           d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  }
  function pageShort(p){
    if(!p) return '';
    var s=String(p).replace(/^https?:\/\/[^\/]+/,'').split('?')[0].replace(/^\//,'').replace(/\/$/,'').replace(/\.html$/,'').replace(/\/index$/,'');
    return s||'accueil';
  }
  // Canal d'acquisition : parcours joint par le navigateur (referrer/UTM) en priorité,
  // sinon l'en-tête Referer de la page du formulaire (anciens leads).
  function canalLabel(l){
    var utm={}; try{ utm=(l.parcours&&JSON.parse(l.parcours).utm)||{}; }catch(_){ utm={}; }
    if(utm.gclid || /gclid|gad_source|gbraid|wbraid|gadid/i.test(l.source_page||'')) return 'Google Ads';
    if(utm.utm_source) return utm.utm_source+(utm.utm_medium?' / '+utm.utm_medium:'');
    var ref=l.referrer||'';
    if(!ref) return l.landing_page ? 'directe' : (l.source_page ? 'directe / inconnue' : 'directe');
    try{
      var h=new URL(ref).hostname.replace(/^www\./,'');
      if(/(^|\.)google\./.test(h)) return 'Google';
      if(/(^|\.)bing\.com$/.test(h)) return 'Bing';
      if(/chatgpt|openai/.test(h)) return 'ChatGPT';
      if(/perplexity/.test(h)) return 'Perplexity';
      if(/claude\.ai|anthropic/.test(h)) return 'Claude';
      return h;
    }catch(_){ return 'lien'; }
  }
  function originCell(l){
    var canal='<span class="canal">'+esc(canalLabel(l))+'</span>';
    var entree=l.landing_page ? l.landing_page : l.source_page;   // anciens leads : page du formulaire
    var entreeHtml=entree ? '<span class="entree">↳ '+esc(pageShort(entree))+'</span>' : '';
    var pages=[]; try{ pages=(l.parcours&&JSON.parse(l.parcours).pages)||[]; }catch(_){ pages=[]; }
    var chemin='';
    if(pages.length>1){
      chemin='<span class="chemin" title="'+esc(pages.map(pageShort).join(' → '))+'">'+pages.length+' pages vues</span>';
    }
    return canal+entreeHtml+chemin;
  }
  function typeBadge(t){
    if(t==='demande') return '<span class="badge type-audit">Audit 199€</span>';
    if(t==='apercu')  return '<span class="badge type-apercu">Aperçu 3 btl</span>';
    if(t==='tableur') return '<span class="badge type-tableur">Tableur</span>';
    return '<span class="badge type-offerte">Offerte</span>';
  }
  function rappelBadge(l){
    return l.rappel ? '<span class="rappel">☎ rappel · '+esc(l.rappel)+'</span>' : '';
  }
  function echeanceLine(l){
    return l.echeance ? '<span class="echeance">⏱ '+esc(l.echeance)+'</span>' : '';
  }
  // Cellule « taille » : nb de références (offerte) ou volume estimé (demande d'audit).
  function sizeCell(l){
    if(l.type==='tableur') return '<span class="cave-txt">—</span>';
    var demande = (l.type==='demande' || l.type==='apercu');
    var v = demande ? l.volume : l.nb_references;
    var b='';
    if(demande){
      if(v==='Plus de 300') b='<span class="badge hot">🔥 chaud</span>';
      else if(v==='100 à 300') b='<span class="badge warm">tiède</span>';
    } else {
      if(v==='200 et plus') b='<span class="badge hot">🔥 chaud</span>';
      else if(v==='50 à 200') b='<span class="badge warm">tiède</span>';
    }
    return b + '<span class="cave-txt">'+esc(v||'—')+'</span>';
  }
  function prospectCell(l){
    var mail = '<a href="mailto:'+esc(l.email)+'">'+esc(l.email)+'</a>';
    if(l.type==='offerte' || l.type==='tableur' || !l.type) return mail;
    var name = [l.prenom,l.nom].filter(Boolean).map(esc).join(' ');
    var tel = l.telephone ? '<span class="tel">'+esc(l.telephone)+'</span>' : '';
    return (name?'<strong>'+name+'</strong>':'') + mail + tel + rappelBadge(l);
  }
  // Cellule « demande » : la bouteille (offerte) ou le contexte + format + situation (audit).
  function demandeCell(l){
    if(l.type==='tableur'){
      return '<strong>Tableur envoyé</strong><span>Fichier + guide de remplissage par email</span>';
    }
    if(l.type==='apercu'){
      var bt = String(l.bouteilles||'').split(' | ').filter(Boolean).map(function(b){return '<span>'+esc(b)+'</span>';}).join('<br>');
      return '<strong>'+esc(l.contexte||'—')+'</strong>'+bt+echeanceLine(l);
    }
    if(l.type==='demande'){
      var meta = [l.format].filter(Boolean).map(esc).join(' · ');
      var n = Number(l.nb_fichiers)||0;
      var files = n>0 ? '<span class="attach">📎 '+n+' fichier'+(n>1?'s':'')+'</span>' : '';
      var sit = '';
      if(l.situation){
        var s = String(l.situation);
        var short = s.length>90 ? s.slice(0,90)+'…' : s;
        sit = '<span class="detail-note" title="'+esc(s)+'">'+esc(short)+'</span>';
      }
      return '<strong>'+esc(l.contexte||'—')+'</strong>'+(meta?'<span>'+meta+'</span>':'')+sit+files+echeanceLine(l);
    }
    return '<strong>'+esc(l.domaine||'—')+'</strong><span>'+
      [l.appellation,l.millesime,l.format,l.quantite].filter(Boolean).map(esc).join(' · ')+'</span>';
  }
  function statutOptions(cur){
    return STATUTS.map(function(s){
      return '<option value="'+s.v+'"'+(s.v===cur?' selected':'')+'>'+s.l+'</option>';
    }).join('');
  }

  // ── Suivi : ce qu'il y a à faire, calculé sur la date du dernier changement de statut ──
  // (statut_at, posé côté serveur ; à défaut created_at pour les anciens leads).
  var JOUR = 24*60*60*1000;
  function joursOuvres(from, to){
    var d=new Date(from); d.setHours(0,0,0,0); var end=new Date(to); end.setHours(0,0,0,0); var n=0;
    while(d<end){ d.setDate(d.getDate()+1); var wd=d.getDay(); if(wd!==0&&wd!==6) n++; }
    return n;
  }
  function suivi(l){
    var s=l.statut||'a_traiter';
    if(s==='converti'||s==='paye'||s==='perdu') return null;
    if(l.type==='tableur'||l.type==='offerte') return null;
    var ref=new Date(l.statut_at||l.created_at); if(isNaN(ref)) return null;
    var now=new Date(); var jours=Math.floor((now-ref)/JOUR);
    if(s==='a_traiter'){
      var jo=joursOuvres(ref, now);
      if(jo>=2) return {cls:'due', txt:'réponse en retard', sub:'reçu il y a '+jours+' j'};
      return {cls:'soon', txt:'à répondre', sub:'reçu il y a '+jours+' j'};
    }
    if(s==='repondu'){
      if(jours>=7) return {cls:'due', txt:'relance J+7 due', sub:'répondu il y a '+jours+' j'};
      return {cls:'ok', txt:'attente réponse', sub:'J+7 dans '+(7-jours)+' j'};
    }
    if(s==='relance'){
      if(jours>=14) return {cls:'due', txt:'clôture J+21 due', sub:'relancé il y a '+jours+' j'};
      return {cls:'ok', txt:'relancé', sub:'clôture dans '+(14-jours)+' j'};
    }
    return null;
  }
  function isDue(l){ var v=suivi(l); return !!(v&&v.cls==='due'); }
  function suiviCell(l){
    var v=suivi(l);
    if(!v) return '<span class="suivi none">—</span>';
    return '<span class="suivi '+v.cls+'">'+esc(v.txt)+'</span><span class="suivi-d">'+esc(v.sub)+'</span>';
  }

  function rowHtml(l){
    return '<tr data-id="'+l.id+'">'+
      '<td class="c-date">'+fmtDate(l.created_at)+'</td>'+
      '<td>'+typeBadge(l.type)+'</td>'+
      '<td class="c-prospect">'+prospectCell(l)+'</td>'+
      '<td class="c-bottle">'+demandeCell(l)+'</td>'+
      '<td class="c-src">'+originCell(l)+'</td>'+
      '<td class="c-cave">'+sizeCell(l)+'</td>'+
      '<td class="c-suivi">'+suiviCell(l)+'</td>'+
      '<td><input type="text" class="f-cote" value="'+esc(l.cote)+'" placeholder="—"></td>'+
      '<td><select class="f-statut">'+statutOptions(l.statut)+'</select></td>'+
      '<td class="c-notes"><input type="text" class="f-notes" value="'+esc(l.notes)+'" placeholder="…"></td>'+
      '<td><button class="btn-save" type="button">Enregistrer</button></td>'+
    '</tr>';
  }

  function render(){
    // Filtre combiné : type (offerte / demande) PUIS statut.
    var base = typeFilter ? all.filter(function(l){return (l.type||'offerte')===typeFilter;}) : all;
    var list = filter==='_due' ? base.filter(isDue) : (filter ? base.filter(function(l){return l.statut===filter;}) : base);
    document.getElementById('tbody').innerHTML = list.map(rowHtml).join('');
    document.getElementById('empty').hidden = list.length>0;

    // Chips « type » — compteurs sur l'ensemble des leads.
    var tCounts = {}; all.forEach(function(l){ var t=l.type||'offerte'; tCounts[t]=(tCounts[t]||0)+1; });
    var tChips = '<button class="chip'+(typeFilter===''?' active':'')+'" data-t="">Tous types <span class="n">'+all.length+'</span></button>';
    tChips += TYPES.map(function(t){
      return '<button class="chip'+(typeFilter===t.v?' active':'')+'" data-t="'+t.v+'">'+t.l+' <span class="n">'+(tCounts[t.v]||0)+'</span></button>';
    }).join('');
    document.getElementById('type-filters').innerHTML = tChips;

    // Chips « statut » — compteurs dans le périmètre du type sélectionné.
    var counts = {}; base.forEach(function(l){ counts[l.statut]=(counts[l.statut]||0)+1; });
    var chips = '<button class="chip'+(filter===''?' active':'')+'" data-f="">Tous <span class="n">'+base.length+'</span></button>';
    chips += STATUTS.map(function(s){
      return '<button class="chip'+(filter===s.v?' active':'')+'" data-f="'+s.v+'">'+s.l+' <span class="n">'+(counts[s.v]||0)+'</span></button>';
    }).join('');
    var nDue = base.filter(isDue).length;
    chips += '<button class="chip due'+(filter==='_due'?' active':'')+'" data-f="_due">⏰ À relancer <span class="n">'+nDue+'</span></button>';
    document.getElementById('filters').innerHTML = chips;

    document.getElementById('meta').textContent =
      list.length+' lead'+(list.length>1?'s':'')+' affiché'+(list.length>1?'s':'')+' · '+all.length+' au total';

    // Boucle clic → lead → client : audits + aperçus (les « offertes » 1 bouteille sont hors périmètre).
    var pool = all.filter(function(l){ return l.type==='demande' || l.type==='apercu'; });
    var nPay = pool.filter(function(l){ return l.statut==='paye'; }).length;
    var nConv = pool.filter(function(l){ return l.statut==='converti'; }).length;
    var nPerdu = pool.filter(function(l){ return l.statut==='perdu'; }).length;
    var nOuverts = pool.length - nPay - nPerdu;
    var taux = pool.length ? Math.round(100*nPay/pool.length) : 0;
    function kpi(v,l,cls){ return '<div class="kpi'+(cls?' '+cls:'')+'"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>'; }
    document.getElementById('funnel').innerHTML =
      kpi(pool.length,'leads audit + aperçu') +
      kpi(nOuverts,'en cours') +
      kpi(nConv,'mission confirmée') +
      kpi(nPay,'payés · '+taux+' %','paye') +
      kpi(nPerdu,'perdus');
  }

  function showApp(){ document.getElementById('login').hidden=true; document.getElementById('app').hidden=false; }
  function showLogin(msg){
    document.getElementById('app').hidden=true;
    document.getElementById('login').hidden=false;
    document.getElementById('login-err').textContent = msg||'';
    var t=document.getElementById('token'); if(t){ t.value=''; t.focus(); }
  }

  function load(){
    document.getElementById('tbody').innerHTML='<tr><td colspan="11" class="loading">Chargement…</td></tr>';
    fetch(API,{headers:headers()}).then(function(r){
      if(r.status===401){ localStorage.removeItem(TKEY); showLogin('Mot de passe incorrect.'); return null; }
      return r.json();
    }).then(function(data){
      if(!data) return;
      if(!data.success){ document.getElementById('tbody').innerHTML='<tr><td colspan="11" class="loading">Erreur : '+esc(data.error||'')+'</td></tr>'; return; }
      all = data.leads||[];
      showApp(); render();
    }).catch(function(){
      document.getElementById('tbody').innerHTML='<tr><td colspan="11" class="loading">Connexion impossible.</td></tr>';
    });
  }

  function saveRow(tr, btn){
    var id = tr.getAttribute('data-id');
    var body = {
      id: id,
      statut: tr.querySelector('.f-statut').value,
      cote: tr.querySelector('.f-cote').value,
      notes: tr.querySelector('.f-notes').value
    };
    var orig = btn.textContent; btn.disabled=true; btn.textContent='…';
    fetch(API,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},headers()),body:JSON.stringify(body)})
      .then(function(r){ if(r.status===401){ localStorage.removeItem(TKEY); showLogin('Session expirée.'); return null; } return r.json(); })
      .then(function(data){
        btn.disabled=false;
        if(!data) return;
        if(data.success){
          // maj cache local
          for(var i=0;i<all.length;i++){ if(String(all[i].id)===String(id)){ all[i]=data.lead; break; } }
          btn.textContent='✓ Enregistré'; btn.classList.add('ok'); tr.classList.add('saved');
          setTimeout(function(){ btn.textContent=orig; btn.classList.remove('ok'); tr.classList.remove('saved'); },1400);
          // si un filtre est actif et que le statut ne correspond plus, on rerend
          if(filter && data.lead.statut!==filter){ setTimeout(render,1400); } else { render(); }
        } else { btn.textContent=orig; alert(data.error||'Erreur'); }
      }).catch(function(){ btn.disabled=false; btn.textContent=orig; alert('Connexion impossible.'); });
  }

  // ── événements ──
  document.getElementById('login-form').addEventListener('submit',function(e){
    e.preventDefault();
    var v=document.getElementById('token').value.trim();
    if(!v){ return; }
    localStorage.setItem(TKEY,v);
    load();
  });
  document.getElementById('refresh').addEventListener('click',load);
  document.getElementById('logout').addEventListener('click',function(){ localStorage.removeItem(TKEY); showLogin(''); });
  document.getElementById('filters').addEventListener('click',function(e){
    var c=e.target.closest('.chip'); if(!c) return; filter=c.getAttribute('data-f'); render();
  });
  document.getElementById('type-filters').addEventListener('click',function(e){
    var c=e.target.closest('.chip'); if(!c) return; typeFilter=c.getAttribute('data-t'); render();
  });
  document.getElementById('tbody').addEventListener('click',function(e){
    var b=e.target.closest('.btn-save'); if(!b) return; saveRow(b.closest('tr'), b);
  });

  // ── démarrage ──
  if(token()) load(); else showLogin('');
})();
</script>
</body>
</html>
